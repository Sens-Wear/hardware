<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1480" viewBox="0 0 2000 1480">
  <title>SensWear V1R1 packaging layout</title>
  <desc>
    Dimensioned concept drawing for a 180 by 130 by 45 millimetre SensWear kit box,
    including upper PCB and ring tray, lower accessory tray, and vertical section.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8"
      markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <pattern id="foam" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#e2e8f0"/>
      <path d="M0 12L12 0" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
    <pattern id="cardboard" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f8ead1"/>
      <circle cx="3" cy="4" r="1" fill="#d6b982" opacity="0.55"/>
      <circle cx="10" cy="9" r="1" fill="#d6b982" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 27px Arial, sans-serif; fill: #0f172a; }
      .panel-note { font: 400 17px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 15px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .dimension { font: 700 18px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .dimension-line { stroke: #334155; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .extension { stroke: #94a3b8; stroke-width: 1.5; }
      .outer { fill: url(#cardboard); stroke: #92400e; stroke-width: 4; }
      .inner { fill: url(#foam); stroke: #64748b; stroke-width: 2.5; }
      .pocket { fill: #f8fafc; stroke: #64748b; stroke-width: 2.5; }
      .assumed { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .pcb { fill: #0f766e; stroke: #064e3b; stroke-width: 2; }
      .copper { fill: #f59e0b; }
      .leader { fill: none; stroke: #475569; stroke-width: 2; }
      .section-label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .section-note { font: 400 15px Arial, sans-serif; fill: #475569; }
      .on-pcb { fill: #ffffff; }
    </style>
  </defs>

  <rect width="2000" height="1480" fill="#f8fafc"/>

  <text x="70" y="62" class="title">SensWear V1R1 — dimensioned packaging concept</text>
  <text x="70" y="99" class="subtitle">
    Recommended carton: 180 × 130 × 45 mm outside · approximately 165 × 115 × 36 mm usable inside
  </text>
  <rect x="1570" y="46" width="350" height="58" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1745" y="70" class="small" style="font-weight:700">CONCEPT — NOT A CUTTING DIELINE</text>
  <text x="1745" y="91" class="tiny">Verify the final battery, ring and cable samples.</text>

  <!-- Upper tray -->
  <text x="510" y="137" class="panel-title" text-anchor="middle">A. Upper presentation tray</text>
  <text x="510" y="164" class="panel-note" text-anchor="middle">PCBs, ring enclosure and 100 mm FFC · suggested insert depth: 14 mm</text>

  <!-- Top overall dimension -->
  <line x1="60" y1="830" x2="60" y2="872" class="extension"/>
  <line x1="960" y1="830" x2="960" y2="872" class="extension"/>
  <line x1="60" y1="860" x2="960" y2="860" class="dimension-line"/>
  <rect x="461" y="845" width="98" height="29" rx="8" fill="#f8fafc"/>
  <text x="510" y="866" class="dimension">180 mm</text>

  <!-- Upper carton and insert -->
  <rect x="60" y="180" width="900" height="650" rx="15" class="outer" filter="url(#shadow)"/>
  <rect x="97.5" y="217.5" width="825" height="575" rx="12" class="inner"/>

  <!-- 130 mm vertical dimension -->
  <line x1="48" y1="180" x2="25" y2="180" class="extension"/>
  <line x1="48" y1="830" x2="25" y2="830" class="extension"/>
  <line x1="34" y1="180" x2="34" y2="830" class="dimension-line"/>
  <g transform="translate(19 505) rotate(-90)">
    <rect x="-47" y="-14" width="94" height="28" rx="8" fill="#f8fafc"/>
    <text y="7" class="dimension">130 mm</text>
  </g>

  <rect x="364" y="765" width="292" height="28" rx="8" fill="#f8fafc" opacity="0.9"/>
  <text x="510" y="786" class="small">Usable insert plan: 165 × 115 mm</text>

  <!-- FFC pocket: 110 x 15 mm -->
  <rect x="125" y="250" width="550" height="75" rx="18" class="pocket"/>
  <path d="M151 286 C220 261, 278 311, 346 286 S472 261, 540 286 S616 311, 650 286"
    fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
  <line x1="151" y1="278" x2="151" y2="294" stroke="#92400e" stroke-width="3"/>
  <line x1="650" y1="278" x2="650" y2="294" stroke="#92400e" stroke-width="3"/>
  <text x="400" y="276" class="label">11-pin FFC</text>
  <text x="400" y="308" class="small">100 mm cable · 110 × 15 mm pocket</text>

  <!-- Ring enclosure pocket: diameter 38 mm -->
  <circle cx="827.5" cy="312.5" r="95" class="assumed"/>
  <circle cx="827.5" cy="312.5" r="60" fill="none" stroke="#ea580c" stroke-width="10"/>
  <text x="827.5" y="300" class="label">Ring enclosure</text>
  <text x="827.5" y="329" class="small">assumed ≤ Ø32 mm</text>
  <text x="827.5" y="353" class="small">Ø38 × 12 mm pocket</text>

  <!-- Main PCB pocket: 58 x 16 mm -->
  <rect x="125" y="365" width="290" height="80" rx="13" class="pocket"/>
  <rect x="144" y="384" width="252" height="42" rx="5" class="pcb"/>
  <circle cx="173" cy="405" r="8" class="copper"/>
  <rect x="341" y="392" width="31" height="26" rx="3" class="copper"/>
  <text x="270" y="390" class="label on-pcb">Main PCB</text>
  <text x="270" y="415" class="small on-pcb">50.5 × 8.5 mm</text>
  <text x="270" y="467" class="small">58 × 16 mm pocket</text>

  <!-- Touch PCB pocket: 59 x 14 mm -->
  <rect x="435" y="365" width="295" height="70" rx="13" class="pocket"/>
  <rect x="454" y="383" width="258" height="33" rx="4" class="pcb"/>
  <path d="M474 400 h215" stroke="#f59e0b" stroke-width="6" stroke-dasharray="16 8"/>
  <text x="582" y="390" class="label on-pcb">Touch PCB</text>
  <text x="582" y="414" class="small on-pcb">51.6 × 6.5 mm</text>
  <text x="582" y="457" class="small">59 × 14 mm pocket</text>

  <!-- PPG pocket: 28 x 15 mm -->
  <rect x="125" y="500" width="140" height="75" rx="13" class="pocket"/>
  <path d="M141 516 h101 v-8 h16 v51 h-16 v-8 H141 z" class="pcb"/>
  <circle cx="233" cy="533" r="8" class="copper"/>
  <text x="195" y="535" class="label on-pcb">PPG</text>
  <text x="195" y="558" class="tiny on-pcb">21.8 × 8.5 mm</text>
  <text x="195" y="598" class="small">28 × 15 mm pocket</text>

  <!-- Haptic pocket: 23 x 15 mm -->
  <rect x="295" y="500" width="115" height="75" rx="13" class="pocket"/>
  <path d="M310 518 h66 v-9 h18 v50 h-18 v-8 h-66 z" class="pcb"/>
  <circle cx="376" cy="535" r="9" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="351" y="535" class="label on-pcb" style="font-size:16px">Haptic</text>
  <text x="351" y="558" class="tiny on-pcb">16.6 × 8.5 mm</text>
  <text x="352" y="598" class="small">23 × 15 mm pocket</text>

  <!-- Temperature pocket: 19 x 12 mm -->
  <rect x="440" y="507.5" width="95" height="60" rx="12" class="pocket"/>
  <path d="M454 520 h56 v-6 h14 v47 h-14 v-7 h-56 z" class="pcb"/>
  <rect x="493" y="530" width="13" height="13" rx="2" class="copper"/>
  <text x="487" y="537" class="label on-pcb" style="font-size:13px">TEMP</text>
  <text x="487" y="558" class="tiny on-pcb">13 × 5.5 mm</text>
  <text x="488" y="591" class="small">19 × 12 mm pocket</text>

  <text x="520" y="733" class="panel-note" text-anchor="middle">
    Keep 5–8 mm foam between pockets; add finger notches after physical-fit testing.
  </text>

  <!-- Lower tray -->
  <text x="1470" y="137" class="panel-title" text-anchor="middle">B. Lower accessory tray</text>
  <text x="1470" y="164" class="panel-note" text-anchor="middle">Debug board, pogo cable and isolated battery · suggested insert depth: 20 mm</text>

  <line x1="1020" y1="830" x2="1020" y2="872" class="extension"/>
  <line x1="1920" y1="830" x2="1920" y2="872" class="extension"/>
  <line x1="1020" y1="860" x2="1920" y2="860" class="dimension-line"/>
  <rect x="1421" y="845" width="98" height="29" rx="8" fill="#f8fafc"/>
  <text x="1470" y="866" class="dimension">180 mm</text>

  <rect x="1020" y="180" width="900" height="650" rx="15" class="outer" filter="url(#shadow)"/>
  <rect x="1057.5" y="217.5" width="825" height="575" rx="12" class="inner"/>

  <line x1="1932" y1="180" x2="1958" y2="180" class="extension"/>
  <line x1="1932" y1="830" x2="1958" y2="830" class="extension"/>
  <line x1="1947" y1="180" x2="1947" y2="830" class="dimension-line"/>
  <g transform="translate(1962 505) rotate(-90)">
    <rect x="-47" y="-14" width="94" height="28" rx="8" fill="#f8fafc"/>
    <text y="7" class="dimension">130 mm</text>
  </g>

  <!-- Debug board pocket: 48 x 43 mm -->
  <rect x="1090" y="260" width="240" height="215" rx="18" class="pocket"/>
  <rect x="1110" y="280" width="200" height="175" rx="6" class="pcb"/>
  <rect x="1122" y="300" width="82" height="30" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <rect x="1122" y="404" width="82" height="30" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <rect x="1250" y="344" width="42" height="48" rx="4" class="copper"/>
  <text x="1210" y="355" class="label on-pcb">Debug PCB</text>
  <text x="1210" y="382" class="small on-pcb">40 × 35 mm</text>
  <text x="1210" y="500" class="small">48 × 43 × 10 mm pocket</text>

  <!-- Pogo cable pocket: 80 x 60 mm -->
  <rect x="1415" y="245" width="400" height="300" rx="24" class="assumed"/>
  <path d="M1515 353
           c95 -90 214 17 119 86
           c-78 57 -174 -4 -124 -62
           c39 -45 121 -11 84 28
           c-28 30 -78 5 -55 -20"
    fill="none" stroke="#e2e8f0" stroke-width="17" stroke-linecap="round"/>
  <path d="M1515 353
           c95 -90 214 17 119 86
           c-78 57 -174 -4 -124 -62
           c39 -45 121 -11 84 28
           c-28 30 -78 5 -55 -20"
    fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <rect x="1460" y="337" width="66" height="32" rx="7" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <circle cx="1463" cy="353" r="8" fill="#f59e0b"/>
  <rect x="1664" y="386" width="64" height="40" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="1728" y="393" width="30" height="26" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="1615" y="292" class="label">Pogo cable</text>
  <text x="1615" y="318" class="small">assumed coil ≤ 70 × 50 × 15 mm</text>
  <text x="1615" y="520" class="small">80 × 60 × 16 mm pocket</text>

  <!-- Curved battery pocket: 45 x 25 mm -->
  <rect x="1090" y="575" width="225" height="125" rx="20" class="assumed"/>
  <path d="M1124 655 Q1202 576 1280 655 L1261 674 Q1202 614 1143 674 Z"
    fill="#334155" stroke="#0f172a" stroke-width="3"/>
  <path d="M1268 643 q26 -14 36 5" fill="none" stroke="#dc2626" stroke-width="4"/>
  <path d="M1268 652 q24 1 31 16" fill="none" stroke="#0f172a" stroke-width="4"/>
  <text x="1202" y="608" class="label">Curved battery</text>
  <text x="1202" y="631" class="small">assumed ≤ 40 × 20 × 6 mm</text>
  <text x="1202" y="724" class="small">45 × 25 × 10 mm pocket</text>

  <!-- Battery isolation callout -->
  <path d="M1317 636 H1372 V683 H1450" class="leader"/>
  <rect x="1450" y="642" width="365" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1469" y="669" class="section-label">Battery isolation</text>
  <text x="1469" y="694" class="section-note">Nonconductive pocket or inner sleeve;</text>
  <text x="1469" y="715" class="section-note">protect terminals and prevent movement.</text>

  <text x="1470" y="744" class="panel-note" text-anchor="middle">
    Cable length and connector style must be confirmed before tooling the insert.
  </text>
  <rect x="1324" y="765" width="292" height="28" rx="8" fill="#f8fafc" opacity="0.9"/>
  <text x="1470" y="786" class="small">Usable insert plan: 165 × 115 mm</text>

  <!-- Cross section -->
  <line x1="70" y1="895" x2="1930" y2="895" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="946" class="panel-title">C. Height allocation — section through the closed box</text>
  <text x="80" y="974" class="panel-note">The 36 mm usable stack is held inside an approximately 45 mm closed carton.</text>

  <!-- Section drawing, 8 px per mm vertically -->
  <rect x="205" y="1015" width="1000" height="360" rx="8" fill="#ffffff" stroke="#92400e" stroke-width="4" filter="url(#shadow)"/>
  <rect x="205" y="1015" width="1000" height="36" fill="url(#cardboard)" stroke="#92400e" stroke-width="2"/>
  <rect x="205" y="1051" width="1000" height="112" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="205" y="1163" width="1000" height="16" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="205" y="1179" width="1000" height="160" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="205" y="1339" width="1000" height="36" fill="url(#cardboard)" stroke="#92400e" stroke-width="2"/>

  <!-- Components in section -->
  <rect x="345" y="1101" width="245" height="40" rx="6" class="pcb"/>
  <path d="M790 1141 Q860 1064 930 1141" fill="none" stroke="#ea580c" stroke-width="18"/>
  <rect x="360" y="1240" width="215" height="74" rx="10" class="pcb"/>
  <path d="M760 1286 c75 -75 175 28 100 29 c-54 1 -71 -45 -21 -54"
    fill="none" stroke="#94a3b8" stroke-width="15" stroke-linecap="round"/>

  <!-- Overall height dimension -->
  <line x1="190" y1="1015" x2="146" y2="1015" class="extension"/>
  <line x1="190" y1="1375" x2="146" y2="1375" class="extension"/>
  <line x1="155" y1="1015" x2="155" y2="1375" class="dimension-line"/>
  <g transform="translate(139 1195) rotate(-90)">
    <rect x="-42" y="-14" width="84" height="28" rx="8" fill="#f8fafc"/>
    <text y="7" class="dimension">45 mm</text>
  </g>

  <!-- Cross-section labels -->
  <path d="M1210 1033 H1290" class="leader"/>
  <text x="1310" y="1039" class="section-label">4.5 mm — lid board + protective pad</text>
  <path d="M1210 1107 H1290" class="leader"/>
  <text x="1310" y="1113" class="section-label">14 mm — upper presentation tray</text>
  <text x="1310" y="1137" class="section-note">PCBs, FFC and ring enclosure</text>
  <path d="M1210 1171 H1290" class="leader"/>
  <text x="1310" y="1177" class="section-label">2 mm — rigid separator</text>
  <path d="M1210 1259 H1290" class="leader"/>
  <text x="1310" y="1265" class="section-label">20 mm — lower accessory tray</text>
  <text x="1310" y="1289" class="section-note">Debug PCB, pogo cable and battery</text>
  <path d="M1210 1357 H1290" class="leader"/>
  <text x="1310" y="1363" class="section-label">4.5 mm — base pad + carton board</text>

  <!-- Footer notes -->
  <rect x="70" y="1412" width="1860" height="48" rx="10" fill="#e2e8f0"/>
  <text x="1000" y="1442" class="small">
    Pocket dimensions include handling clearance. PCB dimensions come from the SensWear V1R1 fabrication outlines; accessory dimensions are stated assumptions.
  </text>
</svg>
